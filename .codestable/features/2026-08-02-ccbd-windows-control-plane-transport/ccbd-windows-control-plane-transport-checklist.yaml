    unauthenticated_tcp_listener: forbidden
    named_pipe_production_adapter: forbidden
    rpc_schema_handler_changes: forbidden
    herdr_namespace_lifecycle_changes: forbidden
    provider_runtime_changes: forbidden
    recovery_owner_changes: forbidden
    mobile_config_ui_changes: forbidden
    package_release_changes: forbidden
    debug_output: forbidden
    temporary_todo: forbidden
