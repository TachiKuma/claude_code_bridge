feature: 2026-07-31-herdr-bounded-recovery-boundary
created: 2026-07-31

steps:
  - id: S1
    action: "Admission and policy contract：确认 provider-runtime-on-herdr implementation/acceptance ready，并定义 HerdrRecoveryPolicy owner=ccb"
    exit_signal: "provider-runtime-on-herdr roadmap done、acceptance passed、artifact/evidence refs 存在；Herdr auto restore mode 必须可证明 disabled，observe-only/unsupported/unknown 时 dependency/capability blocked"
    status: pending
  - id: S2
    action: "Evidence ledger and redaction：扩展 Herdr recovery evidence ledger，sanitize namespace_ref.restore_token，输出 refs、health、restore_token_present、agent_state_ref、action/reason"
    exit_signal: "recovery events/logs/project-visible evidence 的 namespace_ref 不含 raw restore_token；含 raw token 的 runtime.namespace_ref fixture 只输出 restore_token_present；ledger 可区分 pane/process/namespace/daemon health 和 Herdr auto restore mode"
    status: pending
  - id: S3
    action: "Probation/circuit state machine：保留 restart_count backoff，补齐 90 秒 probation projection、success gate 和 durable circuit"
    exit_signal: "backoff 命中不调用 Herdr restore/respawn；probation 未到期不写 recover_succeeded/steady；90 秒内不稳定写 recover_failed；circuit threshold 后 blocked"
    status: pending
  - id: S4
    action: "Recovery action routing：pane/process/namespace/daemon Herdr health 由 CCB supervision 路由，lifecycle start refresh 复用同一 gate"
    exit_signal: "pane/process 走 runtime_service/provider session recovery；namespace restore 通过 CCB-owned runtime/namespace service private call；daemon 只在 project-owned/allowed 时 recover；Herdr auto restore 非 disabled 时 blocked"
    status: pending
  - id: S5
    action: "Provider pane primitive：支持 Herdr pane_ref respawn/reattach recovery primitive，不要求 tmux %pane，且不进入 tmux ownership/identity 分支"
    exit_signal: "fake Herdr backend 可 respawn/reattach 并写 evidence；provider auth revoked/recovery_blocked hard-block；tmux/rmux pane recovery 不退化"
    status: pending
  - id: S6
    action: "Crash log retention and regression guard：保留 bounded crash logs/reason sidecar，运行 tmux/rmux recovery regression、Herdr fake recovery tests、scope/content guard"
    exit_signal: "existing rmux/restore/crash tests 通过；新增 Herdr recovery focused tests 通过；bounded crash logs/reason sidecar 保留；无 provider completion/user-surface/package/release/update/installer/Herdr socket schema-client 越界"
    status: pending
  - id: S7
    action: "Native Windows recovery evidence：收集 Herdr pane/process/namespace recovery transcript 或 auto-restore blocked evidence"
    exit_signal: "transcript 显示 CCB owner、Herdr operation/evidence、90s probation/circuit；缺 host/Herdr 时 acceptance blocked"
    status: pending

checks:
  - item: "provider-runtime-on-herdr 不是仅 design-review passed，而是 implementation/acceptance evidence 可验证"
    source: design AC-001 / DOD-IMPL-000 / S1
    status: pending
  - item: "HerdrRecoveryPolicy owner 固定为 ccb，Herdr auto restore 必须 disabled；observe-only/unsupported/unknown 不能进入 recovery-capable 或 supported"
    source: design AC-003 / DOD-IMPL-001 / S1
    status: pending
  - item: "Herdr recovery evidence ledger redacted，namespace_ref.restore_token 不进入 public payload，只输出 restore_token_present"
    source: design AC-002 / AC-006 / DOD-IMPL-002 / S2
    status: pending
  - item: "90 秒 probation、restart_count backoff、durable circuit 保留，probation 未到期不能写 recover_succeeded/steady"
    source: design AC-004 / AC-007 / DOD-IMPL-003 / S3
    status: pending
  - item: "pane/process/namespace/daemon recovery action 均由 CCB supervision 路由，lifecycle start refresh 不绕过同一 gate"
    source: design AC-005 / AC-006 / DOD-IMPL-004 / S4
    status: pending
  - item: "Herdr pane_ref recovery 不要求 tmux %pane，也不进入 tmux ownership/identity 分支；provider auth revoked hard-block"
    source: design AC-008 / DOD-IMPL-005 / S5
    status: pending
  - item: "tmux/rmux recovery regression 不退化"
    source: design AC-009 / S6
    status: pending
  - item: "Native Windows x64 Herdr recovery transcript 覆盖 auto restore disabled 下的 recovery，或 auto-restore-not-disabled blocked evidence"
    source: design AC-010 / DOD-ACCEPT-001 / S7
    status: pending
  - item: "本 feature 不修改 provider completion、Mobile/Config UI、doctor/support、package/release/update/installer/public matrix、Herdr socket schema/client owner"
    source: design AC-011 / 明确不做 / S6
    status: pending

dod:
  commands:
    - id: CMD-001
      command: "python \".codestable/tools/validate-yaml.py\" --file \".codestable/features/2026-07-31-herdr-bounded-recovery-boundary/herdr-bounded-recovery-boundary-checklist.yaml\" --yaml-only"
      core: true
      failure_handling: fix-or-block
    - id: CMD-002
      command: "python \".codestable/tools/validate-yaml.py\" --file \".codestable/roadmap/windows-native-herdr-ccb/windows-native-herdr-ccb-items.yaml\""
      core: true
      failure_handling: fix-or-block
    - id: CMD-003
      command: >-
        python -c "import pathlib, re; root=pathlib.Path('.codestable/features'); items=pathlib.Path('.codestable/roadmap/windows-native-herdr-ccb/windows-native-herdr-ccb-items.yaml').read_text(encoding='utf-8'); slug='provider-runtime-on-herdr'; feature='2026-07-31-provider-runtime-on-herdr'; artifact_marker=re.compile(r'(Required Artifacts|required artifacts|evidence_required|证据|交付物|artifact)', re.I); ref_marker=re.compile(r'(CMD-\d+|pytest|transcript|\.json|\.md|evidence|artifact|test)', re.I); missing=[]; missing += [] if re.search(r'- slug: '+re.escape(slug)+r'[\s\S]*?status: done[\s\S]*?feature: '+re.escape(feature), items) else [f'{slug}: roadmap not done']; read=lambda p: p.read_text(encoding='utf-8',errors='ignore'); ok=any(('doc_type: feature-acceptance' in (text:=read(p)) and 'status: passed' in text and artifact_marker.search(text) and ref_marker.search(text)) for p in (root/feature).glob('*-acceptance.md')); missing += [] if ok else [f'{feature}: acceptance missing/passed/artifact-evidence-refs']; assert not missing, missing"
      core: true
      failure_handling: dependency-blocked
    - id: CMD-004
      command: "python -m pytest -q test/test_ccbd_rmux_supervision_recovery.py test/test_ccbd_restore_helpers.py test/test_pane_crash_reason.py -k \"recovery or recover or crash or backoff or blocked\""
      core: true
      failure_handling: fix-or-block
    - id: CMD-005
      command: "python -m pytest -q test/test_ccbd_herdr_recovery_boundary.py -k \"herdr or recovery or probation or circuit or restore or owner\""
      core: true
      failure_handling: fix-or-block
      test_status: new
    - id: CMD-006
      command: "python -m pytest -q test/test_ccbd_runtime_refresh.py test/test_ccbd_health_monitor_rebind.py -k \"recovery or recover or herdr or restored or blocked\""
      core: true
      failure_handling: fix-or-block
    - id: CMD-007
      command: >-
        python -c "import pathlib, subprocess, re; run=lambda a: subprocess.run(a,capture_output=True,text=True,check=True).stdout; paths={p.replace(chr(92),'/') for a in (['git','diff','--name-only'],['git','diff','--cached','--name-only','--diff-filter=ACMR'],['git','ls-files','--others','--exclude-standard']) for p in run(a).splitlines() if p.strip()}; implementation_roots=('lib/','test/','bin/','scripts/'); scoped=sorted(p for p in paths if p.startswith(implementation_roots)); forbidden_prefix=('lib/mobile/','mobile/','config-ui/','lib/config_ui/','lib/cli/services/doctor_runtime/'); forbidden_files={'package.json','package-lock.json','install.ps1','install.sh','install.cmd','README.md','docs/ccbd-diagnostics-contract.md','bin/ccb-npm-install.js','lib/cli/management_runtime/install.py','lib/cli/management_runtime/commands_runtime/install.py','lib/cli/services/doctor.py','lib/cli/render_runtime/ops_views_doctor.py','lib/terminal_runtime/rmux_packaging_support.py','lib/terminal_runtime/rmux_packaging_support_projection.json'}; herdr_owner=re.compile(r'(^|/)(lib|test)/.*herdr.*(socket|schema|client)|(^|/)(lib|test)/.*(socket|schema|client).*herdr', re.I); bad=sorted(p for p in scoped if p.startswith(forbidden_prefix) or p in forbidden_files or herdr_owner.search(p)); assert not bad, bad; text=run(['git','diff','--','lib','test','bin','scripts'])+run(['git','diff','--cached','--','lib','test','bin','scripts'])+''.join(pathlib.Path(p).read_text(encoding='utf-8',errors='ignore') for p in scoped if pathlib.Path(p).is_file() and p.endswith(('.py','.md','.yaml','.yml','.json','.js','.ps1','.sh','.cmd'))); forbidden=re.compile(r'(CompletionStatus\.COMPLETED|support_tier|npm publish|release surface|update surface|installer|public workflow validation|Mobile terminal|Config UI|HerdrSocket|herdr socket (client|schema)|schema[_-]?parser)', re.I); assert not forbidden.search(text)"
      core: true
      failure_handling: fix-or-block
    - id: CMD-008
      command: >-
        python -c "import pathlib, subprocess, re; run=lambda a: subprocess.run(a,capture_output=True,text=True,check=True).stdout; paths={p.replace(chr(92),'/') for a in (['git','diff','--name-only','--','lib','test'],['git','diff','--cached','--name-only','--diff-filter=ACMR','--','lib','test'],['git','ls-files','--others','--exclude-standard','--','lib','test']) for p in run(a).splitlines() if p.strip()}; text=run(['git','diff','--','lib','test'])+run(['git','diff','--cached','--','lib','test'])+''.join(pathlib.Path(p).read_text(encoding='utf-8',errors='ignore') for p in paths if pathlib.Path(p).is_file() and p.endswith(('.py','.md','.yaml','.yml','.json'))); assert re.search(r'probation_seconds|probation|restored-probation|recovery_probation', text, re.I); assert re.search(r'circuit_threshold|circuit_open|recovery_circuit', text, re.I); raw_key=r'(?<![A-Za-z0-9_])restore_token(?![A-Za-z0-9_])'; public=re.compile(r'(evidence_ledger|append_recovery_event|details=|diagnostics|project_view|support|logger|print).*'+raw_key+r'|'+raw_key+r'.*(evidence_ledger|append_recovery_event|details=|diagnostics|project_view|support|logger|print)', re.I|re.S); assert not public.search(text)"
      core: true
      failure_handling: fix-or-block
    - id: CMD-009
      command: "MANUAL Native Windows x64: capture Herdr recovery transcript for pane/process/namespace recovery with auto restore disabled, or auto-restore-not-disabled blocked evidence, including 90s probation/circuit evidence"
      core: true
      failure_handling: blocked-if-no-host-or-herdr
