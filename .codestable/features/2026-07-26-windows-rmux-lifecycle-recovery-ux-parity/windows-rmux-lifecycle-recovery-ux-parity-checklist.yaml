feature: 2026-07-26-windows-rmux-lifecycle-recovery-ux-parity
created: 2026-07-26

steps:
  - action: "Baseline inventory：记录 supervision、full-chain smoke、validation matrix 的 accepted refs、当前 artifacts 和 parent readiness"
    exit_signal: "lifecycle report baseline refs 指向存在的 acceptance、matrix report、manual transcript；pane_identity_layout/output_capture parent readiness 已记录；未 accepted parent 不允许相关 live lane 写 full pass"
    status: pending
  - action: "Lifecycle report schema：建立 lifecycle-recovery-ux-report.json schema 与 feature-local builder / validator"
    exit_signal: "required fields、scenario/verdict/failure_class/evidence_source enum、diagnostics_ref、next_action、residual risk 规则可由测试验证，且 builder/validator 不承载在 validation matrix pass 语义里"
    status: pending
  - action: "Reattach / terminal closed lanes：覆盖重新 attach 与关闭 WezTerm 不等于 kill 的 UX 场景"
    exit_signal: "reattach 与 terminal_closed 分别有 report case；GUI 不可用时 blocked/partial 且 residual risk 非空"
    status: pending
  - action: "Kill cleanup lane：复用 full-chain cleanup evidence 并补用户可读 residue summary"
    exit_signal: "endpoint、token、rmux namespace/session、owned process/job residue 都有字段；bounded residue 有 reason"
    status: pending
  - action: "Crash / degraded lanes：覆盖 pane_crash、provider_crash、rmux_daemon_crash 的 degraded diagnostics"
    exit_signal: "每条 non-pass case 有 diagnostics_ref、next_action、failure_class；provider_failure 与 system_failure 分离"
    status: pending
  - action: "UX evidence integration：生成 windows-rmux-ux-parity-evidence.json 并固定 parity_dimension=lifecycle_recovery"
    exit_signal: "roadmap §4.1 required fields、enum、artifact refs、parent readiness、partial/blocked/failed residual risk 校验通过"
    status: pending
  - action: "Broken path closure / minimal implementation：仅在 report 证明 UX path broken 时做最小实现修复"
    exit_signal: "相关 pytest、YAML/JSON validation、matrix parser smoke 通过；无证据时不改 production recovery"
    status: pending

checks:
  - item: "lifecycle report case 必须包含 scenario、start_state、action、expected_observable、verdict、cleanup_residue、diagnostics_ref、next_action、evidence_source、failure_class、residual_risks"
    source: 名词契约
    status: pending
  - item: "partial、failed、blocked case 不允许 failure_class=none；pass case 必须 failure_class=none"
    source: 名词契约
    status: pending
  - item: "evidence_source 必须为 fixture、manual_transcript、validation_matrix、diagnostics_bundle、supervision_event、mixed 之一；GUI full pass 不能只用 fixture/headless source"
    source: 名词契约
    status: pending
  - item: "UX evidence JSON 必须符合 roadmap §4.1，且 parity_dimension=lifecycle_recovery"
    source: 名词契约
    status: pending
  - item: "reattach 与 terminal_closed 必须分开，不得把关闭 WezTerm 解释为 ccb kill"
    source: 流程级约束
    status: pending
  - item: "kill_cleanup 必须覆盖 ccbd endpoint、TCP token、rmux namespace/session、provider/job/process residue"
    source: 验收场景
    status: pending
  - item: "pane_crash、provider_crash、rmux_daemon_crash 的 non-pass 场景必须有 diagnostics_ref 和 next_action"
    source: 验收场景
    status: pending
  - item: "provider_failure 不得污染 rmux/system failure；真实 provider auth/quota/credential failure 不归为 lifecycle failure"
    source: 流程级约束
    status: pending
  - item: "valid_non_success 不得直接升级为 UX pass，必须转换并记录 diagnostics_ref / residual risk"
    source: 流程级约束
    status: pending
  - item: "不默认重写 supervision/recovery、不改 provider parser、不修改 support tier/docs/install"
    source: 范围守护
    status: pending
  - item: "feature evidence 目录必须包含 lifecycle-recovery-ux-report.json 和 windows-rmux-ux-parity-evidence.json"
    source: 挂载点
    status: pending
  - item: "若 native Windows + WezTerm 前台证据不可用，不得写 full pass"
    source: 验收场景
    status: pending
  - item: "parent pane_identity_layout 与 output_capture readiness 必须从 roadmap item 和对应 feature artifact 读取；任一未 accepted 时，依赖身份/capture 的 live lane 只能 partial/blocked"
    source: parent readiness gate
    status: pending
  - item: "lifecycle builder / validator 必须保持 feature-local；不得把 lifecycle UX schema 或 pass 判定塞进 scripts/rmux_windows_validation_matrix.py 的既有 matrix 语义"
    source: 挂载点
    status: pending

dod:
  commands:
    - id: CMD-001
      command: "python \".codestable/tools/validate-yaml.py\" --file \".codestable/features/2026-07-26-windows-rmux-lifecycle-recovery-ux-parity/windows-rmux-lifecycle-recovery-ux-parity-checklist.yaml\" --yaml-only"
      core: true
      failure_handling: fix-or-block
    - id: CMD-002
      command: "python \".codestable/tools/validate-yaml.py\" --file \".codestable/roadmap/windows-rmux-ux-parity-hardening/windows-rmux-ux-parity-hardening-items.yaml\""
      core: true
      failure_handling: fix-or-block
    - id: CMD-003
      command: "python -m pytest -q test/test_windows_rmux_lifecycle_recovery_ux_parity.py"
      core: true
      failure_handling: fix-or-block
    - id: CMD-004
      command: "python -m pytest -q test/test_rmux_windows_validation_matrix.py"
      core: true
      failure_handling: fix-or-block
    - id: CMD-005
      command: "python -m pytest -q test/test_ccbd_rmux_supervision_recovery.py test/test_ccbd_rmux_supervision_evidence.py test/test_ccbd_diagnostics_bundle_supervision.py"
      core: true
      failure_handling: fix-or-block
    - id: CMD-006
      command: "python -m py_compile \"scripts/rmux_windows_validation_matrix.py\" \"lib/ccbd/supervision/store.py\" \"lib/ccbd/supervision/recovery_events.py\""
      core: true
      failure_handling: fix-or-block
  evidence_required:
    - lifecycle_recovery_ux_report
    - windows_rmux_ux_parity_evidence
    - diagnostics_refs
    - residue_summary
    - parent_readiness_evidence
    - feature_local_builder_validator
    - validation_commands
  cleanliness:
    debug_output: forbidden
    temporary_todo: forbidden
    commented_out_code: forbidden
    unused_imports: forbidden
