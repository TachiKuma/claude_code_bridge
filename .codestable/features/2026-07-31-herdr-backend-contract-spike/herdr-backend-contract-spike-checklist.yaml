feature: 2026-07-31-herdr-backend-contract-spike
created: 2026-07-31

steps:
  - action: "spike scope guard 与 host admission：建立独立 named session、显式 --platform-gate-ref、Windows x64 HostEvidence、Herdr binary/schema ref，以及 dedicated/disposable Herdr server 或 isolated socket/config 的运行前检查"
    exit_signal: "非 Native Windows x64、WSL、platform gate blocked、缺 platform_gate_ref、Herdr 缺失或 restart 无法隔离时写 blocked evidence；脚本不会修改生产代码、用户默认 Herdr session 或全局 Herdr server"
    status: done
  - action: "Herdr schema/status probe：采集 Herdr version/status 和 herdr api schema --json 或等价 schema artifact"
    exit_signal: "schema artifact 存在且 evidence 记录 schema version/ref；schema 不可读时 failure_class 为 schema-mismatch 或 herdr-missing"
    status: done
  - action: "session/pane I/O probe：创建或 attach project-scoped named session，spawn PowerShell pane，发送 sentinel input 并读取/capture sentinel output"
    exit_signal: "operation evidence 同时记录 pane ref、send status、read output match；失败时保留 command refs 和 diagnostic"
    status: done
  - action: "provider CLI dry-run pane probe：在独立 pane 启动无凭证 provider/agent dry-run；provider 不可用时可另跑 fallback terminal smoke"
    exit_signal: "provider_cli_dry_run 与 fallback_terminal_smoke 分离；fallback 只能导致 partial/blocked 或 provider-dry-run-unavailable，不伪造 provider parity，public_provider_parity_claimed=false"
    status: done
  - action: "kill pane probe：kill 一个由 spike 创建的 pane，验证 pane 关闭可观察"
    exit_signal: "kill operation evidence 指向目标 pane，证明未误删 session 或其他 pane"
    status: done
  - action: "detach/reattach identity probe：detach/reattach 独立 named session，验证 session/pane identity 与 live process continuity"
    exit_signal: "detach evidence 与 server restart evidence 分离，进程持续只适用于 live detach"
    status: done
  - action: "isolated server restart restore probe：只在 dedicated/disposable server 或 isolated socket/config 下执行 server restart restore 检查"
    exit_signal: "restart_isolation 字段完整；未隔离时写 blocked evidence 而不是重启全局 server"
    status: done
  - action: "evidence verdict 与 route recommendation：汇总 herdr-contract-spike-evidence.json，给出 continue、continue-with-gaps、stop 或 needs-upstream-issue"
    exit_signal: "JSON 通过 validator；adapter_recommendation=continue 只在 host/platform、failure_class、核心 operation、restart isolation、provider_cli_dry_run 和 capability_projection truth table 全部通过时出现"
    status: done

checks:
  - item: "非 Native Windows x64、WSL、platform gate blocked、缺 platform_gate_ref 或 Herdr 缺失时输出 blocked evidence，不运行 destructive 操作"
    source: design AC-001 / DOD-IMPL-002
    status: passed
  - item: "Herdr version/status/schema 可追溯，schema artifact 被 evidence 引用"
    source: design AC-002 / DOD-IMPL-002
    status: passed
  - item: "独立 named session 创建或 attach 成功，未污染用户默认 session"
    source: design AC-003 / scope guard
    status: passed
  - item: "PowerShell pane probe 记录 pane ref、send status 与 read_output 结果；当前 Herdr CLI 接受 send，但 read 未观察到 sentinel，按 unsupported-capability fail-closed"
    source: design AC-004
    status: passed
  - item: "provider_cli_dry_run 与 fallback_terminal_smoke 分离；provider unavailable 与 Herdr failure 分离，fallback 不支撑 all-provider parity"
    source: design AC-005 / DOD-IMPL-004
    status: passed
  - item: "kill pane 后关闭可观察，未误删 session 或其他 pane"
    source: design AC-006
    status: passed
  - item: "detach/reattach 被单独记录，不夸大 server restart 后的进程存活"
    source: design AC-007 / DOD-IMPL-003
    status: passed
  - item: "server restart 只能在 dedicated/disposable server 或 isolated socket/config 下执行；restart_isolation 包含 server_ref_kind、session_name、socket/config ref、server_identity_before/after、preexisting_sessions_before、created_by_spike、stop_command_ref、cleanup_targets"
    source: design AC-008 / DOD-IMPL-003
    status: passed
  - item: "herdr-contract-spike-evidence.json 通过 schema/semantic validator，recommendation truth table 与 host、operation、provider、restart、capability 状态一致"
    source: design AC-010 / DOD-IMPL-005
    status: passed
  - item: "本 feature 不修改 production terminal_runtime、ccbd、provider_backends、package metadata；resolve_mux_backend(cli_backend='herdr') 仍 invalid-request，production mux contract 不含 herdr-native"
    source: design AC-009 / DOD-IMPL-001 / DOD-IMPL-006
    status: passed

dod:
  commands:
    - id: CMD-001
      command: "python \".codestable/tools/validate-yaml.py\" --file \".codestable/features/2026-07-31-herdr-backend-contract-spike/herdr-backend-contract-spike-checklist.yaml\" --yaml-only"
      core: true
      failure_handling: fix-or-block
    - id: CMD-002
      command: "python \".codestable/tools/validate-yaml.py\" --file \".codestable/roadmap/windows-native-herdr-ccb/windows-native-herdr-ccb-items.yaml\""
      core: true
      failure_handling: fix-or-block
    - id: CMD-003
      command: "python -m pytest -q test/test_herdr_contract_spike_evidence.py"
      core: true
      failure_handling: fix-or-block
      test_status: new
      covers:
        - evidence_schema
        - failure_class_semantics
        - artifact_refs
        - host_platform_gate_required
        - provider_fallback_split
        - restart_isolation_required
        - adapter_recommendation_guard
    - id: CMD-004
      command: "python -m pytest -q test/test_mux_backend_contract.py test/test_terminal_runtime_backend_selection.py test/test_herdr_spike_no_production_route.py"
      core: true
      failure_handling: fix-or-block
      test_status: mixed
      covers:
        - production_contract_no_change
        - resolver_no_herdr_route_in_spike
    - id: CMD-005
      command: cmd /c "set PATH=C:/Users/Administrator/AppData/Local/Programs/Herdr;%PATH% && C:/Users/Administrator/AppData/Local/Programs/Python/Python314/python.exe .codestable/roadmap/windows-native-herdr-ccb/drafts/herdr-backend-contract-spike/run_spike.py --platform-gate-ref .codestable/features/2026-07-31-windows-x64-v852-baseline-gate/evidence/platform-gate-summary.json --session ccb-herdr-spike --isolated-server --isolation-created-by-spike --isolated-socket-ref ccb-herdr-spike --herdr-socket-arg=\"--session\" --out .codestable/features/2026-07-31-herdr-backend-contract-spike/evidence/herdr-contract-spike-evidence.json"
      core: true
      manual_core: native_windows_x64_host
      failure_handling: blocked-evidence-if-host-missing-or-restart-not-isolated
      test_status: new
      covers:
        - native_windows_herdr_spike
        - session_pane_send_capture_kill_restore
        - provider_cli_dry_run_pane
        - fallback_terminal_smoke_split
        - isolated_restart_scope
    - id: CMD-006
      command: "python -m pytest -q test/test_herdr_contract_spike_evidence.py -k \"minimal_machine_check or truth_table\""
      core: true
      failure_handling: fix-or-block
      test_status: new
      covers:
        - evidence_minimal_machine_check
        - residual_risks_required
        - restart_scope_guard
        - capability_projection_guard
        - recommendation_truth_table
  evidence_required:
    - spike_runbook
    - spike_script
    - herdr_schema_snapshot
    - raw_command_refs
    - manual_native_windows_transcript
    - .codestable/features/2026-07-31-herdr-backend-contract-spike/evidence/herdr-contract-spike-evidence.json
    - evidence_validator_test
    - items_yaml_diff
  cleanliness:
    production_runtime_changes: forbidden
    provider_tokens_in_evidence: forbidden
    full_terminal_history_in_evidence: forbidden
    debug_output: forbidden
    temporary_todo: forbidden
    commented_code: forbidden
    dead_imports: forbidden
    publish_or_push_action: forbidden
