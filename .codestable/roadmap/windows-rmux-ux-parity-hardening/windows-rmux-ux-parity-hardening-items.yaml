roadmap: windows-rmux-ux-parity-hardening
created: 2026-07-25

items:
  - slug: windows-rmux-wezterm-native-interaction-parity
    description: 普通 pane 采用 WezTerm GUI-native 交互，sidebar 全接管，滚轮/剪贴板/左键不被 CCB/rmux 劫持
    depends_on: []
    status: in-progress
    feature: 2026-07-25-windows-rmux-wezterm-native-interaction-parity
    minimal_loop: true
    split_required: true
    split_reason: >-
      2026-07-27 owner foreground retest 后确认该 item 不能继续作为单一 feature 验收：
      6 项中仅 ordinary pane single-click focus 通过，ordinary drag selection、right-click paste、
      wheel scroll、sidebar settings click、sidebar x KillProject 均失败。根因审查见
      .codestable/features/2026-07-25-windows-rmux-wezterm-native-interaction-parity/evidence/root-cause-review-and-feature-split.md
    split_children:
      - slug: ordinary-pane-single-click-focus-baseline
        status: passed-baseline
        next_action: seal_as_regression_baseline
      - slug: sidebar-settings-click-e2e
        status: split-to-top-level-item
        owner: trace-only
        canonical_item: sidebar-settings-click-e2e
        next_action: follow_top_level_item
      - slug: sidebar-kill-project-click-e2e
        status: failed
        next_action: design_diagnostic_feature
      - slug: ordinary-pane-drag-selection-native
        status: failed
        next_action: choose_mouse_strategy_before_fix
      - slug: ordinary-pane-right-click-paste
        status: failed
        next_action: choose_clipboard_strategy_before_fix
      - slug: ordinary-pane-wheel-scroll
        status: failed
        next_action: choose_scroll_strategy_before_fix
    brainstorm_required: true
    brainstorm: .codestable/features/2026-07-25-windows-rmux-wezterm-native-interaction-parity/windows-rmux-wezterm-native-interaction-parity-brainstorm.md
    brainstorm_status: confirmed
    design_admission: admitted
    notes: >-
      已先行进入 feature design，且已有 confirmed feature-brainstorm。2026-07-27 前台复测失败后，
      该 item 不得继续按单一验收目标推进；split_children 仅作为历史拆分索引，不认领 child
      feature。canonical owner 以顶层 item 和 roadmap goal-state 为准，其中 sidebar settings / x
      优先做真实 rmux send-keys -M 到 crossterm Event::Mouse 诊断。

  - slug: windows-rmux-output-capture-parity
    description: 验证 rmux capture 与 Linux/macOS tmux baseline 在 provider completion、ANSI、宽字符、wrapping 上的保真边界
    depends_on: [windows-rmux-wezterm-native-interaction-parity]
    status: in-progress
    feature: 2026-07-25-windows-rmux-output-capture-parity
    minimal_loop: false
    brainstorm_required: true
    brainstorm: .codestable/features/2026-07-25-windows-rmux-output-capture-parity/windows-rmux-output-capture-parity-brainstorm.md
    brainstorm_status: confirmed
    design_admission: admitted
    notes: >-
      owner 已通过 $cs-brainstorm 对该 item 完成深入讨论并明确批准/通过进入 design。设计方向为
      parity evidence first：不默认重写 Rmux IO，先建立 machine capture、provider completion、
      user-visible history 的证据矩阵和差异归因。
      用户滚轮不是 capture 证据；必须用后端 capture fixtures 和 provider completion golden fixtures。
      复用 rmux-send-capture-logging accepted evidence 作为 baseline，只补 UX parity delta、跨平台 baseline
      刷新、宽字符/wrapping/尾部空白差异归因，并产出 evidence/windows-rmux-ux-parity-evidence.json

  - slug: sidebar-settings-click-e2e
    description: 诊断并修复 sidebar settings 点击经 rmux send-keys -M 到 crossterm Event::Mouse 的端到端链路
    depends_on: []
    status: blocked
    feature: 2026-07-27-sidebar-settings-click-e2e
    minimal_loop: true
    split_parent: windows-rmux-wezterm-native-interaction-parity
    brainstorm_required: true
    brainstorm: .codestable/features/2026-07-27-sidebar-settings-click-e2e/sidebar-settings-click-e2e-brainstorm.md
    brainstorm_status: confirmed
    design_admission: admitted
    notes: >-
      从 windows-rmux-wezterm-native-interaction-parity 前台复测失败中拆出。该 item 只处理
      sidebar settings 点击链路，先证明真实 sidebar pane identity、helper fingerprint、root binding、
      mouse event/action probe 与 config UI 状态，不合并 KillProject 或普通 pane drag/right/wheel。
      2026-07-27 真实 Windows + WezTerm + rmux 前台复测确认 root binding 可触发，但 rmux 未提供
      mouse_x/mouse_y，且 send-keys -M 未进入 Rust/crossterm mouse event。owner 拒绝 broad fallback
      “sidebar 任意左键打开 settings”，因此本 item 保持 blocked，后续专用通道拆到
      sidebar-settings-rmux-mouse-routing。

  - slug: sidebar-settings-rmux-mouse-routing
    description: 深挖 rmux 无 mouse_x/mouse_y 且 send-keys -M 不透传时，settings-only 点击通道或能力边界
    depends_on: [sidebar-settings-click-e2e]
    status: in-progress
    feature: 2026-07-27-sidebar-settings-rmux-mouse-routing
    minimal_loop: true
    split_parent: sidebar-settings-click-e2e
    brainstorm_required: true
    brainstorm: .codestable/features/2026-07-27-sidebar-settings-rmux-mouse-routing/sidebar-settings-rmux-mouse-routing-brainstorm.md
    brainstorm_status: confirmed
    design_admission: admitted
    notes: >-
      从 sidebar-settings-click-e2e code review blocked 项拆出。目标不是恢复 broad fallback，而是
      研究并实现不影响 sidebar x KillProject、普通 sidebar click、普通 pane drag/right/wheel 的
      settings-only 通道。候选方向包括 rmux capability/source audit、mouse coordinate/passthrough
      upstream limitation evidence、WezTerm/terminal-level precise binding、sidebar header-only auxiliary
      channel、或明确 unsupported capability 投影。owner 已确认按拆分 feature 继续；本 feature 自身
      brainstorm 已落盘并确认，design 只能选择 settings-only 精确通道或 unsupported capability evidence，
      不得恢复 broad sidebar-left-click fallback。

  - slug: windows-rmux-pane-identity-layout-parity
    description: 收口 pane id/index/canonicalization、layout 重建和 agent-pane 绑定恢复
    depends_on: [windows-rmux-wezterm-native-interaction-parity]
    status: in-progress
    feature: 2026-07-25-windows-rmux-pane-identity-layout-parity
    minimal_loop: false
    brainstorm_required: true
    brainstorm: .codestable/features/2026-07-25-windows-rmux-pane-identity-layout-parity/windows-rmux-pane-identity-layout-parity-brainstorm.md
    brainstorm_status: confirmed
    design_admission: admitted
    notes: >-
      owner 已通过 $cs-brainstorm 对该 item 完成深入讨论并明确批准/通过进入 design。设计方向为
      identity evidence + contract first：不默认重写 layout/canonicalization，先建立 pane identity
      snapshot、agent-pane binding 恢复和 identity conflict diagnostics。吸收 %N exact/index alias
      既有问题，复用既有 canonicalization/split/layout 基础；只有证据证明重复 canonicalization
      helper 导致真实漂移时，才把收敛 helper 纳入 design 的实现步骤。必须产出
      evidence/windows-rmux-ux-parity-evidence.json

  - slug: windows-rmux-visual-no-popup-parity
    description: 恢复或替代动态状态栏/边框/标题，同时保证无 Git Bash 或 console popup
    depends_on: [windows-rmux-wezterm-native-interaction-parity]
    status: in-progress
    feature: 2026-07-25-windows-rmux-visual-no-popup-parity
    minimal_loop: false
    brainstorm_required: true
    brainstorm: .codestable/features/2026-07-25-windows-rmux-visual-no-popup-parity/windows-rmux-visual-no-popup-parity-brainstorm.md
    brainstorm_status: confirmed
    design_admission: admitted
    notes: >-
      owner 已通过 $cs-brainstorm 对该 item 完成深入讨论并明确批准/通过进入 design。设计方向为
      evidence-gated dynamic restore：当前 static fallback 是安全 baseline；动态 Git branch、ccbd
      health、border/title/status 恢复前必须有 no-popup probe evidence。不得默认恢复可见 shell hook，
      不重复定义 base support projection，只补 no-popup UX evidence 并产出
      evidence/windows-rmux-ux-parity-evidence.json

  - slug: windows-rmux-lifecycle-recovery-ux-parity
    description: 覆盖 reattach、关闭 WezTerm、kill cleanup、pane/provider/rmux daemon crash 后恢复或 degraded diagnostics
    depends_on: [windows-rmux-pane-identity-layout-parity, windows-rmux-output-capture-parity]
    status: in-progress
    feature: 2026-07-26-windows-rmux-lifecycle-recovery-ux-parity
    minimal_loop: false
    brainstorm_required: true
    brainstorm: .codestable/features/2026-07-26-windows-rmux-lifecycle-recovery-ux-parity/windows-rmux-lifecycle-recovery-ux-parity-brainstorm.md
    brainstorm_status: confirmed
    design_admission: admitted
    notes: >-
      owner 已通过 $cs-brainstorm 对该 item 完成深入讨论并明确批准/通过进入 design。设计方向为
      UX lifecycle evidence first：不默认重写 supervision/recovery 底层，不重做 full-chain smoke；
      先建立 reattach、terminal_closed、kill_cleanup、pane_crash、provider_crash、rmux_daemon_crash
      的 transcript、residue report、diagnostics ref 和用户可见 degraded next action。复用
      rmux-supervision-recovery、ccbd-windows-full-chain-smoke、rmux-windows-validation-matrix baseline；
      若证据证明某条路径 broken，再在 design 中转成最小实现修复，并产出
      evidence/windows-rmux-ux-parity-evidence.json

  - slug: windows-rmux-supportability-parity-contract
    description: 汇总 parity evidence 到 doctor/install/support tier/docs，一致表达 beta/supported/blocked 和 fallback
    depends_on: [windows-rmux-wezterm-native-interaction-parity, windows-rmux-output-capture-parity, windows-rmux-pane-identity-layout-parity, windows-rmux-visual-no-popup-parity, windows-rmux-lifecycle-recovery-ux-parity]
    status: in-progress
    feature: 2026-07-26-windows-rmux-supportability-parity-contract
    minimal_loop: false
    brainstorm_required: true
    brainstorm: .codestable/features/2026-07-26-windows-rmux-supportability-parity-contract/windows-rmux-supportability-parity-contract-brainstorm.md
    brainstorm_status: confirmed
    design_admission: admitted
    notes: >-
      owner 已通过 $cs-brainstorm 对该 item 完成深入讨论并明确批准/通过进入 design。设计方向为
      evidence aggregation first：消费 rmux-packaging-docs-contracts 最终 support projection，作为 UX
      parity overlay；不重复定义 npm、install.ps1、release guard，不单独授权 npm 发布。必须聚合所有
      child 的 evidence/windows-rmux-ux-parity-evidence.json；缺失 core dimension 时投影为 missing，
      failed/blocked 不得宣称 supported，partial 只能进入 beta 并列 residual risks。
