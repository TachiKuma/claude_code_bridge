roadmap: windows-native-herdr-ccb
created: 2026-07-30

items:
  - slug: windows-x64-v852-baseline-gate
    description: 建立 CCB v8.5.2 与 Native Windows x64-only 准入、诊断和 package metadata 口径
    depends_on: []
    status: done
    feature: 2026-07-31-windows-x64-v852-baseline-gate
    minimal_loop: false
    notes: "只产出 platform gate contract、版本/位宽探测和 startup/doctor 基础诊断；implementation admission 必须证明从 CCB v8.5.2 源头拉取并在新分支推进；当前工作区状态只能 blocked/default；os=win32 表示 Windows OS，cpu=x64 才表示 64-bit。"

  - slug: herdr-backend-contract-spike
    description: 用 Herdr socket API 在 Native Windows x64 上验证 session、pane、send、capture、kill、restore 和 provider dry-run 最小语义
    depends_on: [windows-x64-v852-baseline-gate]
    status: done
    feature: 2026-07-31-herdr-backend-contract-spike
    minimal_loop: true
    notes: "只产出 spike 与 evidence；Restore Capability Matrix v2 证据为 verdict=partial、failure_class=windows-beta-gap、adapter_recommendation=continue-with-gaps。v8.5.2 source admission、64-bit Python、Native Windows x64 Herdr 与两个 CCB native helper x64 PE evidence 已满足；schema/status/session_attach/pane_spawn/send_input/read_output/kill_pane/server_restart_layout_restore 已通过。server_restart_process_continuity 与 server_restart_output_history 明确 unsupported；ui_detach_reattach 需要 Herdr UI harness，已记录 follow-up herdr-ui-detach-reattach-harness。后续 adapter 可按 layout-only restart restore + CCB-side recovery 继续，不得宣称 process/output continuity 或 Windows supported。"

  - slug: mux-backend-contract-herdr-v2
    description: 将既有 mux 小协议升级为支持 tmux、rmux、herdr 共存的 backend contract v2
    depends_on: [herdr-backend-contract-spike]
    status: done
    feature: 2026-07-31-mux-backend-contract-herdr-v2
    minimal_loop: false
    notes: "Herdr 伪装为 tmux-family；本 feature 只交付 backend contract V2（backend-neutral refs/capabilities/structured errors）、fake Herdr fixture、resolver V2 诊断与上游 spike->capability fail-closed 投影。Native Windows x64 + 合规 capability evidence 才路由 herdr；缺 evidence/平台 gate、windows_beta_gaps、blocking_gaps 一律 fail-closed（herdr-capability-missing / platform-gate-blocked / unsupported-capability），非 Windows 保留 tmux/rmux。不引入生产 Herdr client / provider runtime / ccbd 状态迁移。CMD-001..006 全 exit 0，contract+selection 34 passed、v2 namespace 16 passed，运行时功能驱动全部断言通过。"

  - slug: herdr-backend-client
    description: 实现 Herdr socket client、schema/version gate、capability gate、structured error 与 operation evidence
    depends_on: [mux-backend-contract-herdr-v2]
    status: done
    feature: 2026-07-31-herdr-backend-client
    minimal_loop: false
    notes: "实现 terminal_runtime HerdrBackend、HerdrSocketClient、HerdrCliRequestAdapter、schema/capability fail-closed gate、operation evidence 与 resolver/factory 接线；explicit herdr 和 Native Windows auto 在 gate 失败时返回 V2 diagnostics，不 fallback tmux；非 Windows auto/default 保持 tmux。重开修复真实 Herdr server lifecycle 启动 seam 与 bottom->down split direction 归一；真实 Herdr smoke 通过。send_text/pane run 语义留给后续用户输入面 feature。"

  - slug: ccbd-windows-control-plane-transport
    description: 恢复 ccbd control-plane transport seam 与 Windows TCP loopback adapter，使 Native Windows ccb->ccbd 控制面可启动
    depends_on: [herdr-backend-client]
    status: done
    feature: 2026-08-02-ccbd-windows-control-plane-transport
    minimal_loop: false
    notes: "accepted 2026-08-02：恢复 ccb<->ccbd 控制面 seam、Unix adapter 不漂移、Windows TCP loopback + same-user token、endpoint store/bootstrap/diagnostics redaction。CMD-008 manifest 证明 control-plane transport blocker removed，原始 transcript 中 namespace create/foreground/reload 仍 blocked，归属后续 ccbd-herdr-namespace-lifecycle；不修改 Herdr namespace lifecycle、provider runtime、recovery、Mobile/Config UI、package/release/update。"

  - slug: ccbd-herdr-namespace-lifecycle
    description: 将 Herdr backend 接入 ccbd project namespace、pane topology、foreground attach、kill、restart 和 reload
    depends_on: [ccbd-windows-control-plane-transport]
    status: done
    feature: 2026-07-31-ccbd-herdr-namespace-lifecycle
    minimal_loop: false
    notes: "accepted 2026-08-02；S0-S7、review、QA、acceptance 均通过。CMD-013 Native Windows x64 transcript verdict=passed：namespace create、foreground attach、reload apply、kill 均通过；restart 明确 deferred_to_provider_runtime_on_herdr。未承接 provider runtime/recovery/user-surface/release 范围；为 provider-runtime-on-herdr 提供 Herdr namespace/pane evidence。"

  - slug: provider-runtime-on-herdr
    description: 让所有公开 provider 在 Herdr pane 中完成启动、ask、pend、completion、cancel 和 provider state 绑定
    depends_on: [ccbd-herdr-namespace-lifecycle]
    status: done
    feature: 2026-07-31-provider-runtime-on-herdr
    minimal_loop: false
    notes: "accepted 2026-08-03：S1-S7、review、QA、acceptance 均通过。Provider runtime 支持 Herdr assigned pane launch/session payload/lifecycle/completion authority/cancel/restart surface contract；Herdr agent state diagnostics-only，completion/cancel authority 仍归 CCB。S7 冻结当前 public provider catalog 20 项（含 qoder/qoderclicn），全部 provider 行因缺生产 API 授权/credential readiness 或 CLI 缺失记录 explicit blocked evidence；这满足证据完整性但不得宣称 supported。CMD-004 全量 runtime launch bundle 仍是 Codex bridge bootstrap baseline-risk。下游 recovery/user-surface/release/public matrix/supportability 必须继续 fail closed。"

  - slug: herdr-bounded-recovery-boundary
    description: 对齐 CCB v8.5.2 bounded pane recovery 与 Herdr session restore，确保恢复 owner 唯一
    depends_on: [provider-runtime-on-herdr]
    status: done
    feature: 2026-07-31-herdr-bounded-recovery-boundary
    minimal_loop: false
    notes: "accepted 2026-08-03：S1-S7、review、QA、acceptance 均通过。CCB 是唯一 recovery owner；Herdr auto restore 只有 disabled 可进入 recovery-capable path，observe-only/unsupported/unknown fail closed。实现覆盖 recovery ledger redaction、raw restore token presence 投影、90 秒 probation、Herdr 3 次 circuit threshold、lifecycle-start tick blocked evidence、pane/process/namespace/daemon CCB-owned routing、backend-neutral Herdr pane_ref primitive 和 tmux/rmux regression。真实 Herdr server 当前 not_running/capabilities null，仅记录 blocked evidence，不得宣称 supported recovery。"

  - slug: herdr-user-surfaces-parity
    description: 将 Herdr backend evidence 投影到 foreground attach、Mobile terminal、Config UI、doctor、ping、mounted 和 project view
    depends_on: [provider-runtime-on-herdr, herdr-bounded-recovery-boundary]
    status: in-progress
    feature: 2026-07-31-herdr-user-surfaces-parity
    minimal_loop: false
    notes: "用户可见面必须展示 beta gaps、degraded next action 和 support tier；Mobile terminal 与 Config UI 是 supported hard gate，degraded/partial 不得宣称 supported。"

  - slug: windows-x64-release-surface
    description: 补齐 Windows x64 npm/install/update/native helper/managed Python/doctor 的发布面 gate
    depends_on: [windows-x64-v852-baseline-gate, herdr-user-surfaces-parity]
    status: in-progress
    feature: 2026-07-31-windows-x64-release-surface
    minimal_loop: false
    notes: "消费 windows-x64-v852-baseline-gate 的 platform gate，不重新实现位宽探测；只建立 release surface 和 Windows npm install dry-run gate；不授权 npm publish、release、push 或 promotion。"

  - slug: native-windows-public-workflow-validation-matrix
    description: 在 Native Windows x64 上验证 CCB public workflows 的 pass、partial、blocked、failed 证据矩阵
    depends_on: [windows-x64-release-surface, herdr-user-surfaces-parity]
    status: in-progress
    feature: 2026-07-31-native-windows-public-workflow-validation-matrix
    minimal_loop: false
    notes: "覆盖 ccb、watch、ping、mounted、kill、restart、reload、foreground attach、Mobile terminal、Config UI、doctor/update，以及所有公开 provider 在 Herdr pane 下的 ask、pend、completion、cancel；证据来自专用 Native Windows x64 主机。"

  - slug: herdr-supportability-projection
    description: 将 validation evidence 汇总到 support tier、README/docs、doctor 和 residual risk
    depends_on: [native-windows-public-workflow-validation-matrix]
    status: in-progress
    feature: 2026-07-31-herdr-supportability-projection
    minimal_loop: false
    notes: "core workflows、所有公开 provider、Mobile/Config UI、Herdr auto restore disabled、strict v8.5.2、Windows npm install dry-run 未全 pass 前只能投影为 unsupported/experimental/beta；blocked 或 partial 不得宣称 supported。"
